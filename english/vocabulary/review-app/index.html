<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vocabulary Review App</title>
    <meta name="description" content="An interactive vocabulary review and flashcard web application">
    <meta property="og:title" content="Vocabulary Review App">
    <meta property="og:description" content="An interactive vocabulary review and flashcard web application">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="vocab_data.js"></script>
    <script src="script.js" defer></script>
</head>
<body>
    <div class="app-container">
        <header>
            <h1>Vocabulary Review</h1>
            <p class="subtitle">Click on any card to flip it and reveal the meaning</p>
            <div class="search-container">
                <input type="text" id="search-input" placeholder="Search for words or meanings...">
            </div>
            <div class="controls">
                <select id="sort-select" class="sort-select">
                    <option value="default">Default Order</option>
                    <option value="newest">Newest First</option>
                    <option value="oldest">Oldest First</option>
                </select>
                <button id="btn-show-all">Reveal All</button>
                <button id="btn-hide-all">Hide All</button>
                <button id="btn-shuffle">Shuffle</button>
            </div>
        </header>

        <main id="vocab-list" class="vocab-grid">
            <!-- Cards will be dynamically inserted here by script.js -->
        </main>

        <div id="pagination" class="pagination-container">
            <!-- Pagination buttons will be dynamically inserted here -->
        </div>
    </div>
</body>
</html>
