speaking_first: true
level: B1
session_minutes_default: 90
language_style:
  conversational: true
  natural_us_speech: true
  avoid_formal_jargon: true
  use_contractions: true
  focus_clarity_over_perfection: true
blocks:
  warmup: 10
  input: 15
  shadowing: 15
  vocabulary: 10
  speaking_task: 25
  pronunciation: 10
  log: 5
feedback:
  reformulations: 3
  pronunciation_cues: 1
  grammar_upgrades: 1
personas:
  professional:
    default: Senior PM
    alternates:
      - Finance lead
      - Platform lead
      - New hire
  everyday:
    default: Curious friend
    alternates:
      - Family member
      - Colleague outside work
      - New acquaintance
metrics:
  - wpm
  - chunks_used
  - complex_sentences
  - intelligibility
vocabulary:
  path: weeks/week-01/day-01/vocabularies
  format: ipa,definition,pos,usage5,synonyms
weekly_requirements:
  grammar_monologue: true
  grammar_lessons: true
  teaching_transcript: true
  echoing_practice_transcript: true
